variables:
  BUILD: "false"

default:
  image: gibson-registry.telecomnancy.univ-lorraine.fr/projets/2526/pcl/projet/fise-groupe-10:latest
stages:
  - image-build
  - compilation
  - test

build:
  stage: image-build
  rules:
    - if: $BUILD == "true"
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  script:
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/Dockerfile"
      --destination "${CI_REGISTRY_IMAGE}"

compile:  
  stage: compilation
  rules:
    - if: $BUILD == "false"  
  script:
    - make all
  artifacts:
    paths:
      - main

positive_tests_lexer:
  allow_failure: false
  needs:
    - job: compile
  rules:
    - if: $BUILD == "false"
  stage: test  
  script:
    - make successTests

negative_tests_lexer:
  allow_failure: false
  needs:
    - job: compile
  rules:
    - if: $BUILD == "false"
  stage: test  
  script:
    - make failTests
